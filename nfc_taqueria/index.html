<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú VIP | Taquería La Pasadita</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --surface: #1e1e1e;
            --primary: #ff5e00;
            --text-light: #ffffff;
            --text-gray: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-dark); color: var(--text-light); max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 80px; }

        .hero { height: 250px; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; color: white; border-bottom: 1px solid #333; }
        .hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .hero p { color: var(--primary); font-weight: 600; font-size: 14px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

        .categories-scroll { display: flex; overflow-x: auto; padding: 15px 20px; gap: 10px; scrollbar-width: none; position: sticky; top: 0; background: rgba(18,18,18,0.95); z-index: 50; backdrop-filter: blur(10px); border-bottom: 1px solid #333; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--surface); color: var(--text-light); padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; transition: all 0.3s; cursor: pointer; border: 1px solid #333; }
        .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .menu-container { padding: 10px 20px; }
        .category-title { font-size: 20px; font-weight: 700; margin: 20px 0 15px 0; color: var(--text-light); border-bottom: 2px solid #333; padding-bottom: 5px; }

        .menu-item { display: flex; background: var(--surface); border-radius: 15px; margin-bottom: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.2s; border: 1px solid #2a2a2a; }
        .menu-item:active { transform: scale(0.97); }
        .menu-img { width: 110px; height: 130px; object-fit: cover; }
        .menu-info { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .menu-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .menu-header h3 { font-size: 15px; width: 70%; font-weight: 600; }
        .price { color: var(--primary); font-weight: 700; font-size: 15px; }
        .menu-desc { font-size: 12px; color: var(--text-gray); margin-top: 5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .badge { display: inline-block; background: rgba(255,94,0,0.1); color: var(--primary); font-size: 10px; padding: 4px 8px; border-radius: 8px; margin-top: 8px; font-weight: bold; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .bottom-sheet { position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-radius: 25px 25px 0 0; z-index: 101; transition: bottom 0.3s ease-out; padding: 25px 20px; border-top: 1px solid #333; max-height: 90vh; overflow-y: auto; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .bottom-sheet.active { bottom: 0; }
        .sheet-img { width: 100%; height: 220px; border-radius: 15px; object-fit: cover; margin-bottom: 20px; }
        .sheet-title { font-size: 22px; font-weight: 700; margin-bottom: 5px; }
        .sheet-price { color: var(--primary); font-size: 22px; font-weight: 700; margin-bottom: 15px; }
        .sheet-desc { color: var(--text-gray); font-size: 14px; line-height: 1.6; margin-bottom: 25px; }

        .btn-add { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .floating-cart { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 440px; background: var(--primary); color: white; padding: 15px 25px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; z-index: 50; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 94, 0, 0.4); font-weight: bold; }

        .full-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; min-height: 100vh; background: var(--bg-dark); z-index: 200; padding-bottom: 50px; }
        .modal-header { display: flex; align-items: center; padding: 20px; border-bottom: 1px solid #333; position: sticky; top: 0; background: var(--surface); z-index: 10; }
        .back-btn { font-size: 24px; font-weight: bold; color: var(--primary); cursor: pointer; margin-right: 15px; }
        .modal-header h2 { font-size: 18px; color: var(--text-light); }
        .modal-body { padding: 20px; }
        .cart-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #333; }
        .total-row { display: flex; justify-content: space-between; padding: 20px 0; font-size: 20px; font-weight: bold; color: var(--primary); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-gray); }
        .input-group select, .input-group input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; font-size: 15px; background: var(--surface); color: white; font-family: inherit; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: var(--primary); }
        .cash-buttons { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .cash-btn { background: var(--surface); border: 1px solid var(--primary); color: var(--primary); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; flex: 1; text-align: center; }
        .btn-checkout { width: 100%; padding: 15px; border: none; border-radius: 12px; background: #25D366; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .status-container { text-align: center; padding: 40px 20px; }
        .status-icon { font-size: 60px; margin-bottom: 20px; }
        .upsell-card { background: var(--surface); border-radius: 15px; padding: 20px; margin-top: 30px; text-align: center; border: 1px solid #333; }
        .upsell-img { width: 100px; height: 100px; border-radius: 50px; object-fit: cover; margin: 10px 0; }
        .btn-upsell { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        .btn-skip { background: transparent; color: var(--text-gray); border: none; padding: 10px; margin-top: 10px; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <div id="mainAppView">
        <div class="hero" id="heroSection">
            <h1 id="heroTitle">Taquería La Pasadita</h1>
            <p id="heroSubtitle">El mejor sabor de la ciudad</p>
        </div>

        <div class="categories-scroll" id="categoriesScroll"></div>
        <div class="menu-container" id="menuContainer"></div>

        <div class="floating-cart" onclick="openCheckout()" id="floatingCartBtn" style="display:none;">
            <span id="cartTotal">🛒 Tu Orden (0)</span>
            <span>Pedir →</span>
        </div>

        <div class="modal-overlay" id="overlay" onclick="closeProduct()"></div>
        <div class="bottom-sheet" id="productSheet">
            <img src="" alt="Producto" class="sheet-img" id="sheetImg">
            <h2 class="sheet-title" id="sheetTitle">Nombre</h2>
            <div class="sheet-price" id="sheetPrice">$0.00</div>
            <p class="sheet-desc" id="sheetDesc">Descripción</p>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 15px; background: var(--bg-dark); border-radius: 20px; padding: 5px; border: 1px solid #333;">
                    <button style="width:40px; height:40px; border-radius:20px; border:none; background:var(--surface); color:white; font-size:24px; cursor:pointer;" onclick="changeQty(-1)">-</button>
                    <span id="modalQty" style="font-size:18px; font-weight:bold; width: 30px; text-align:center;">1</span>
                    <button style="width:40px; height:40px; border-radius:20px; border:none; background:var(--primary); color:white; font-size:24px; cursor:pointer;" onclick="changeQty(1)">+</button>
                </div>
            </div>
            <button class="btn-add" onclick="addToCart()">Agregar a la Orden</button>
        </div>
    </div>

    <!-- MODAL DE CHECKOUT -->
    <div class="full-modal" id="checkoutModal">
        <div class="modal-header">
            <div class="back-btn" onclick="closeModals()">←</div>
            <h2>Resumen de Tu Orden</h2>
        </div>
        <div class="modal-body">
            <div id="cartItems"></div>
            <div class="total-row"><span>TOTAL:</span><span id="totalPrice">$0.00</span></div>
            
            <div class="input-group">
                <label>Dirección de Envío o Mesa</label>
                <input type="text" id="waAddress" placeholder="Ej. Mesa 4 / Calle Zaragoza #123">
            </div>

            <div class="input-group">
                <label>Método de Pago</label>
                <select id="waPaymentMethod" onchange="toggleCashInput()">
                    <option value="Efectivo">Efectivo (Pago a la entrega)</option>
                    <option value="Transferencia">Transferencia</option>
                </select>
            </div>
            
            <div class="input-group" id="cashExtraInputs">
                <label>¿Con qué billete vas a pagar?</label>
                <input type="number" id="waCashAmount" placeholder="Monto para llevarte cambio" style="margin-bottom: 5px;">
                <div id="waCashError" style="color: var(--primary); font-size: 12px; display: none; font-weight: bold; margin-bottom: 5px;"></div>
                <div class="cash-buttons">
                    <div class="cash-btn" onclick="setExactCash()">Exacto</div>
                    <div class="cash-btn" onclick="setCash(100)">$100</div>
                    <div class="cash-btn" onclick="setCash(200)">$200</div>
                    <div class="cash-btn" onclick="setCash(500)">$500</div>
                </div>
            </div>

            <button class="btn-checkout" onclick="checkoutWhatsApp()">HACER PEDIDO POR WHATSAPP</button>
        </div>
    </div>

    <!-- MODAL DE STATUS -->
    <div class="full-modal" id="statusModal">
        <div class="status-container">
            <div class="status-icon" id="statusIcon">🌮</div>
            <h2 id="statusTitle">¡Preparando tu Orden!</h2>
            <p id="statusSubtitle" style="color: var(--text-gray); margin-top: 10px;">Abriendo WhatsApp...</p>
        </div>
    </div>

    <script>
        let menuData = [];
        let globalConfig = { 
            whatsapp: "528132492165",
            restaurantName: "TAQUERÍA LA PASADITA",
            restaurantSubtitle: "El mejor sabor de la ciudad",
            heroImage: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&q=80&w=600"
        };
        let cart = {}; 
        let total = 0;
        let activeCategory = "Todos";
        let modalCurrentQty = 1;

        window.onload = function() {
            const savedConfig = localStorage.getItem('miMenuConfigTaqueriaV2');
            if(savedConfig) { globalConfig = JSON.parse(savedConfig); }
            
            document.getElementById('heroTitle').innerText = globalConfig.restaurantName;
            document.getElementById('heroSubtitle').innerText = globalConfig.restaurantSubtitle;
            document.getElementById('heroSection').style.backgroundImage = `linear-gradient(to bottom, rgba(18,18,18,0.4), var(--bg-dark)), url('${globalConfig.heroImage}')`;

            const savedData = localStorage.getItem('miMenuDataTaqueriaV2');
            if (savedData) { 
                menuData = JSON.parse(savedData);
            } else {
                menuData = [
                    { name: "Tacos de Trompo", price: 60, description: "Orden de jugosos tacos de trompo.", category: "Tacos", image: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=400&q=80", badge: "Favorito ⭐" },
                    { name: "Tacos Mixtos", price: 70, description: "Orden de tacos mitad trompo y mitad bistec.", category: "Tacos", image: "https://images.unsplash.com/photo-1552332386-f8dd00dc2f85?auto=format&fit=crop&w=400&q=80" },
                    { name: "Campechana", price: 45, description: "Tortilla grande con queso, trompo y bistec.", category: "Tacos", image: "https://images.unsplash.com/photo-1584345604476-8ec5e12e42a5?auto=format&fit=crop&w=400&q=80", badge: "Especial 🔥" },
                    { name: "Promo: 3 Gringas", price: 110, description: "3 Gringas repletas de queso y trompo.", category: "Promociones", image: "https://images.unsplash.com/photo-1613514785940-daed07799d9b?auto=format&fit=crop&w=400&q=80", badge: "Ahorra 🤑" },
                    { name: "Trompoburguer", price: 70, description: "Hamburguesa coronada con jugosa carne de trompo.", category: "Hamburguesas", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80" },
                    { name: "Torta de Bisteck", price: 70, description: "Torta calientita con jugoso bistec.", category: "Tortas", image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=400&q=80" },
                    { name: "Papa Asada con Trompo", price: 75, description: "Nuestra clásica papa asada coronada con trompo.", category: "Papas Asadas", image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=400&q=80", badge: "Exquisita ⭐" },
                    { name: "Plato de Alambre", price: 150, description: "Delicioso alambre de carne con queso, pimiento y cebolla.", category: "Tacos", image: "https://images.unsplash.com/photo-1600850056064-a8b380df8395?auto=format&fit=crop&w=400&q=80" }
                ];
                localStorage.setItem('miMenuDataTaqueriaV2', JSON.stringify(menuData));
            }
            renderCategories();
            renderMenu();
        };

        function renderCategories() {
            const categoriesSet = new Set(menuData.map(item => item.category || "General"));
            let categories = ["Todos", ...Array.from(categoriesSet)];
            let html = "";
            categories.forEach(cat => {
                const activeClass = (cat === activeCategory) ? "active" : "";
                html += `<div class="cat-btn ${activeClass}" onclick="filterCategory('${cat}')">${cat}</div>`;
            });
            document.getElementById('categoriesScroll').innerHTML = html;
        }

        function filterCategory(cat) { activeCategory = cat; renderCategories(); renderMenu(); }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            let html = "";
            let currentCategory = "";

            menuData.forEach((item, index) => {
                const itemCat = item.category || "General";
                if (activeCategory !== "Todos" && itemCat !== activeCategory) return;
                if (itemCat !== currentCategory && activeCategory === "Todos") {
                    html += `<h2 class="category-title">${itemCat}</h2>`;
                    currentCategory = itemCat;
                }

                let badgeHtml = item.badge ? `<div><span class="badge">${item.badge}</span></div>` : "";

                html += `
                <div class="menu-item" onclick="openProduct(${index})">
                    <img src="${item.image}" alt="${item.name}" class="menu-img" onerror="this.src='https://via.placeholder.com/200'">
                    <div class="menu-info">
                        <div>
                            <div class="menu-header"><h3>${item.name}</h3><span class="price">$${parseFloat(item.price).toFixed(2)}</span></div>
                            <p class="menu-desc">${item.description}</p>
                        </div>
                        ${badgeHtml}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        let selectedProductIndex = -1;

        function openProduct(index) {
            selectedProductIndex = index; modalCurrentQty = 1;
            const item = menuData[index];
            document.getElementById('sheetTitle').innerText = item.name;
            document.getElementById('sheetPrice').innerText = "$" + parseFloat(item.price).toFixed(2);
            document.getElementById('sheetDesc').innerText = item.description;
            document.getElementById('sheetImg').src = item.image;
            document.getElementById('modalQty').innerText = modalCurrentQty;
            
            document.getElementById('overlay').classList.add('active');
            document.getElementById('productSheet').classList.add('active');
        }

        function closeProduct() {
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('productSheet').classList.remove('active');
        }

        function changeQty(delta) {
            modalCurrentQty += delta;
            if(modalCurrentQty < 1) modalCurrentQty = 1;
            document.getElementById('modalQty').innerText = modalCurrentQty;
        }

        function addToCart() {
            if (selectedProductIndex === -1) return;
            if(navigator.vibrate) navigator.vibrate(50);
            
            const item = menuData[selectedProductIndex];
            cart[selectedProductIndex] = (cart[selectedProductIndex] || 0) + modalCurrentQty;
            total += parseFloat(item.price) * modalCurrentQty;
            
            updateCartBtn(); closeProduct();
            
            const cartBtn = document.getElementById('floatingCartBtn');
            cartBtn.style.transform = 'translateX(-50%) scale(1.05)';
            setTimeout(() => { cartBtn.style.transform = 'translateX(-50%) scale(1)'; }, 200);
        }

        function updateCartBtn() {
            let count = Object.values(cart).reduce((a, b) => a + b, 0);
            const cartBtn = document.getElementById('floatingCartBtn');
            if(count > 0) {
                cartBtn.style.display = 'flex';
                document.getElementById('cartTotal').innerText = `🛒 Tu Orden (${count})`;
            } else {
                cartBtn.style.display = 'none';
            }
        }

        function getGroupedCart() {
            let counts = {}; let prices = {};
            for(let index in cart) {
                let item = menuData[index];
                counts[item.name] = cart[index]; prices[item.name] = parseFloat(item.price);
            }
            return {counts, prices};
        }

        function openCheckout() {
            let count = Object.values(cart).reduce((a, b) => a + b, 0);
            if(count === 0) { return; }
            
            const grouped = getGroupedCart(); let html = "";
            for(let title in grouped.counts) {
                let qty = grouped.counts[title];
                html += `<div class="cart-item"><span>${qty}x ${title}</span><span>$${(grouped.prices[title]*qty).toFixed(2)}</span></div>`;
            }
            document.getElementById('cartItems').innerHTML = html;
            document.getElementById('totalPrice').innerText = `$${total.toFixed(2)}`;
            
            document.getElementById('mainAppView').style.display = 'none';
            document.getElementById('checkoutModal').style.display = 'block';
            toggleCashInput(); window.scrollTo(0,0);
        }

        function closeModals() {
            document.getElementById('checkoutModal').style.display = 'none';
            document.getElementById('statusModal').style.display = 'none';
            document.getElementById('mainAppView').style.display = 'block';
            window.scrollTo(0,0);
        }

        function toggleCashInput() {
            const method = document.getElementById('waPaymentMethod').value;
            const extra = document.getElementById('cashExtraInputs');
            if(method === 'Efectivo') { extra.style.display = 'block'; setExactCash(); } 
            else { extra.style.display = 'none'; document.getElementById('waCashError').style.display = 'none'; }
        }

        function setExactCash() { document.getElementById('waCashAmount').value = total.toFixed(2); document.getElementById('waCashError').style.display = 'none'; }
        function setCash(amount) { document.getElementById('waCashAmount').value = amount.toFixed(2); document.getElementById('waCashError').style.display = 'none'; }

        function checkoutWhatsApp() {
            const method = document.getElementById('waPaymentMethod').value;
            const cash = document.getElementById('waCashAmount').value;
            const address = document.getElementById('waAddress').value;

            if (method === 'Efectivo') {
                const cashVal = parseFloat(cash);
                if (isNaN(cashVal) || cashVal < total) {
                    document.getElementById('waCashError').innerText = "❌ El monto debe ser de al menos $" + total.toFixed(2);
                    document.getElementById('waCashError').style.display = 'block';
                    return; 
                }
            }

            closeModals(); document.getElementById('mainAppView').style.display = 'none';
            document.getElementById('statusModal').style.display = 'block';
            
            let waText = "Hola! Quiero hacer un pedido a domicilio. Mis platillos son:\n\n";
            
            const grouped = getGroupedCart();
            for(let title in grouped.counts) {
                let qty = grouped.counts[title];
                waText += `👉 ${qty} orden(es) de ${title}\n`;
            }

            waText += `\n💰 *TOTAL A PAGAR: $${total.toFixed(2)}*\n`;
            waText += `\n💳 *Método de pago:* ${method}`;
            if(method === 'Efectivo' && cash) {
                waText += `\n💵 *Pago con:* $${cash}`;
                let cambio = parseFloat(cash) - total;
                if(cambio > 0) { waText += ` (Traer cambio de $${cambio.toFixed(2)})`; }
            }
            if(address) { waText += `\n📍 *Dirección de envío:* ${address}`; }
            waText += `\n\n📱 Pedido enviado desde el menú digital`;

            document.getElementById('statusTitle').innerText = "¡PREPARANDO WHATSAPP!";
            
            const phone = globalConfig.whatsapp ? globalConfig.whatsapp.replace(/\D/g,'') : ''; 
            const encodedText = encodeURIComponent(waText);
            const waUrl = phone.length > 5 ? `https://api.whatsapp.com/send/?phone=${phone}&text=${encodedText}` : `https://api.whatsapp.com/send/?text=${encodedText}`;
            
            setTimeout(() => { window.open(waUrl, '_blank'); }, 1500);
        }
    </script>
</body>
</html>
